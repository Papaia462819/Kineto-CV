# Regulile de feedback live (fără legătură cu scorul clinic).
#
# Fiecare regulă se uită la o măsură (src/feedback.py: MEASURES) și spune un mesaj când e depășit pragul.
#   kind: rep   - se verifică la finalul fiecărei repetări; sună dacă greșeala apare în 2 din ultimele 3 repetări
#         hold  - se verifică continuu; sună dacă abaterea față de poziția de start ține cel puțin `hold_s` secunde
#   stat (doar la rep):
#         peak       - valoarea în vârful repetării
#         min / max  - cea mai mică / mare valoare din repetare
#         range      - max - min în repetare
#         both_sides - la mișcările stânga-dreapta: cât s-a dus în partea mai slabă (față de start)
#         sides_diff - la mișcările stânga-dreapta: diferența dintre cele două părți
#   relative: valoarea se măsoară față de poziția de start (numărătoarea de 5 secunde)
#   bad: low  - greșeala e o valoare prea mică (ex. brațul nu urcă destul)
#        high - greșeala e o valoare prea mare (ex. bazinul se mișcă prea mult)
#   percentile: pragul = această percentilă din execuțiile bune KIMORE (scor medic >= 40);
#               scripts/calibrate_feedback.py îl calculează și scrie config/feedback.json
#   priority: 1 = cel mai important (stabilitate), 3 = țintă; la egalitate se spune unul singur
#   keep: true - regula rămâne chiar dacă pe KIMORE nu deosebește execuțiile bune de cele slabe
#               (celelalte rămân doar dacă sună la cel mult 10% din execuțiile bune și clar mai des la cele slabe)
#
# Precizia măsurii cu camera din față: mișcările spre cameră (axa z: aplecare, rotații) se văd mai slab.

hold_s: 0.7          # cât trebuie să țină o abatere ca să conteze
repeat_s: 6.0        # același mesaj nu se repetă mai des
gap_s: 3.0           # între două mesaje oarecare (vocea nu se suprapune)
good_score: 40       # execuțiile KIMORE din care se calculează pragurile

exercises:
  1:  # Ridicarea brațelor
    - id: arms_higher
      kind: rep
      measure: shoulder
      stat: peak
      bad: low
      percentile: 5
      priority: 3
      message: "Ridică brațele mai sus, deasupra capului."
    - id: elbows_straight
      kind: rep
      measure: elbow
      stat: peak
      bad: low
      percentile: 5
      priority: 2
      message: "Ține coatele întinse."
    - id: arms_even
      kind: rep
      measure: shoulder_diff
      stat: peak
      bad: high
      percentile: 95
      priority: 2
      message: "Ridică ambele brațe la fel de sus."
    - id: back_straight
      kind: hold
      measure: lean
      relative: true
      percentile: 95
      priority: 1
      message: "Ține spatele drept, nu te lăsa pe spate."

  2:  # Înclinări laterale
    - id: tilt_more
      kind: rep
      measure: tilt
      stat: both_sides
      relative: true
      bad: low
      percentile: 5
      priority: 3
      message: "Înclină-te mai mult."
    - id: tilt_even
      kind: rep
      measure: tilt
      stat: sides_diff
      relative: true
      bad: high
      percentile: 95
      priority: 2
      message: "Înclină-te la fel de mult în ambele părți."
    - id: arms_up
      kind: rep
      measure: shoulder
      stat: min
      bad: low
      percentile: 5
      priority: 2
      message: "Ține brațele sus."
    - id: hips_still
      kind: hold
      measure: pelvis_shift
      relative: true
      percentile: 95
      priority: 1
      message: "Ține șoldurile nemișcate."
    - id: tilt_sideways
      kind: hold
      measure: lean
      relative: true
      percentile: 95
      priority: 1
      message: "Înclină-te lateral, nu în față."

  3:  # Rotația trunchiului (bastonul în față, la nivelul umerilor)
    - id: rotate_more
      kind: rep
      measure: shoulder_rotation
      stat: both_sides
      relative: true
      bad: low
      percentile: 5
      priority: 3
      message: "Rotește trunchiul mai mult."
    - id: pelvis_still
      kind: hold
      measure: pelvis_rotation
      relative: true
      percentile: 95
      priority: 1
      message: "Rotește doar trunchiul, ține bazinul pe loc."
    - id: arms_shoulder_height
      kind: rep
      measure: wrist_height
      stat: min
      bad: low
      percentile: 5
      priority: 2
      message: "Ține brațele la nivelul umerilor."
    - id: arms_straight
      kind: rep
      measure: elbow
      stat: min
      bad: low
      percentile: 5
      priority: 2
      message: "Ține brațele întinse."

  4:  # Rotația bazinului (mâinile pe șolduri)
    - id: pelvis_more
      kind: rep
      measure: pelvis_rotation
      stat: range
      bad: low
      percentile: 5
      priority: 3
      message: "Rotește bazinul mai mult."
    - id: shoulders_still
      kind: hold
      measure: shoulder_rotation
      relative: true
      percentile: 95
      priority: 1
      message: "Ține umerii nemișcați, rotește doar bazinul."

  5:  # Genuflexiuni (bastonul în față)
    - id: squat_deeper
      kind: rep
      measure: knee
      stat: peak
      bad: low
      percentile: 5
      priority: 3
      keep: true  # în KIMORE toți coboară destul; la un utilizator nou mesajul rămâne util
      message: "Coboară puțin mai mult."
    - id: knees_even
      kind: rep
      measure: knee_diff
      stat: peak
      bad: high
      percentile: 95
      priority: 2
      message: "Sprijină-te egal pe ambele picioare."
    - id: knees_out
      kind: rep
      measure: knee_ratio
      stat: peak
      bad: low
      percentile: 5
      priority: 2
      message: "Ține genunchii în dreptul picioarelor."
    - id: arms_forward
      kind: rep
      measure: shoulder
      stat: min
      bad: low
      percentile: 5
      priority: 2
      message: "Ține brațele întinse în față."
    - id: back_upright
      kind: rep
      measure: lean
      stat: peak
      relative: true
      bad: high
      percentile: 95
      priority: 1
      message: "Ține spatele cât mai drept."

# Calibrată separat pe fiecare exercițiu: pragul = percentila 5 a duratei urcării (vale → vârf) la execuțiile bune,
# dar cel mult max_threshold secunde.
too_fast:
  id: too_fast
  kind: too_fast
  percentile: 5
  max_threshold: 0.6
  priority: 2
  keep: true
  message: "Mișcă-te mai încet, controlat."

# Valabile la toate exercițiile; pragurile sunt alese de mână, nu calibrate.
general:
  - id: idle
    kind: idle
    threshold: 15.0     # secunde fără nicio repetare
    priority: 3
    message: "Continuă exercițiul."
  - id: tired
    kind: fatigue
    threshold: 0.6      # amplitudinea repetării față de media primelor 3
    priority: 3
    message: "Dacă obosești, ia o pauză."
